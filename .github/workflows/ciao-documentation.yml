name: CIAO Documentation Sync

on:
  push:
    branches: ["**"]

jobs:
  document-and-validate:
    # Ollama must be reachable from this runner. Configure CIAO_RUNNER to a
    # secured self-hosted runner, or use a secured reachable OLLAMA_HOST.
    runs-on: ${{ vars.CIAO_RUNNER || 'self-hosted' }}
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate root documentation and architecture
        if: "!contains(github.event.head_commit.message, '[ciao-generated]')"
        shell: pwsh
        run: |
          python scripts/ciao_sync.py `
            --repo . `
            --branch "${{ github.ref_name }}" `
            --commit-sha "${{ github.sha }}" `
            --document-format "${{ vars.CIAO_DOCUMENT_FORMAT || 'pdf' }}" `
            --image-format "${{ vars.CIAO_IMAGE_FORMAT || 'png' }}" `
            --output-dir .
        env:
          OLLAMA_HOST: ${{ secrets.CIAO_OLLAMA_HOST || vars.CIAO_OLLAMA_HOST || 'http://127.0.0.1:11434' }}
          OLLAMA_MODEL: ${{ vars.CIAO_OLLAMA_MODEL || 'llama3.2:3b' }}
          CIAO_OLLAMA_NUM_PREDICT: ${{ vars.CIAO_OLLAMA_NUM_PREDICT || '2048' }}

      - name: Commit generated files
        if: "!contains(github.event.head_commit.message, '[ciao-generated]')"
        shell: pwsh
        run: |
          git config user.name "ciao-bot"
          git config user.email "ciao-bot@users.noreply.github.com"
          git add documentation.* architecture.* ciao-generation.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: update CIAO architecture outputs [ciao-generated]"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            git push origin "HEAD:${{ github.ref_name }}"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

